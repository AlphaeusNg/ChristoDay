name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Schedule tests
        run: node tools/test-schedule.mjs
      - name: Bible client tests
        run: node tools/test-bible.mjs
      - name: Persisted state tests
        run: node tools/test-state.mjs
      - name: JavaScript syntax
        run: |
          node --check js/schedule.js
          node --check js/bible.js
          node --check js/state.js
          node --check js/app.js
