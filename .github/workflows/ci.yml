name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Workflow policy
        run: node tools/test-workflow.mjs
      - name: Schedule tests
        run: node tools/test-schedule.mjs
      - name: Bible client tests
        run: node tools/test-bible.mjs
      - name: Persisted state tests
        run: node tools/test-state.mjs
      - name: Site and offline structure
        run: node tools/test-site.mjs
      - name: JavaScript syntax
        run: |
          find js tools tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
          node --check sw.js
          node --check playwright.config.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser reading journey
        run: npm run test:browser
